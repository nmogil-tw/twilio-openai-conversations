version: '3.8'

# Production Docker Compose with Redis, PostgreSQL, and optimizations
# Usage: docker-compose -f docker-compose.yml -f docker-compose.production.yml up

services:
  app:
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/conversations
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      # Production optimizations
      - PYTHONHASHSEED=random
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - production-network
    # Production resource limits (more restrictive)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
      # Production deployment strategy
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
    # Override health check for production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 30s
    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Security hardening for production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - production-network
    restart: unless-stopped
    # Production Redis configuration
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
    # Resource limits for Redis
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    # Security
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: conversations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PostgreSQL performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - production-network
    restart: unless-stopped
    # PostgreSQL configuration for better performance
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=100
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conversations"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # Security
    security_opt:
      - no-new-privileges:true

  # Nginx reverse proxy (optimized and uncommented for production)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - production-network
    restart: unless-stopped
    # Resource limits for Nginx
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.1'
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    # Basic nginx configuration
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    # Security
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  production-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: prod-bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

configs:
  nginx_config:
    external: true